version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderfulfillment_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-order_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_secret_pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-orderfulfillment_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: orderfulfillment_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

volumes:
  postgres_data: